name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AAE36C: ${{ secrets.AAE36C }}
          B8519B: ${{ secrets.B8519B }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AAE36C', '')
          tag_b = os.environ.get('B8519B', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 325569f675016d5ba8e06837ef324f6c3b10 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 1454780b317225fcaf5ecf12cb52b34561 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
